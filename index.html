<style>
:root{--blush:#f9d5e0;--lilac:#d9c8f0;--cream:#fff8f3;--gold:#b76e79;--wine:#6b1f3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Playfair Display",Georgia,serif;color:var(--wine);background:linear-gradient(135deg,var(--blush),var(--lilac) 55%,var(--cream));background-size:200% 200%;animation:bg 18s ease infinite}
@keyframes bg{50%{background-position:100% 100%}}
h1,h2{font-family:"Great Vibes","Brush Script MT",cursive;font-weight:400;margin:.2em 0;line-height:1.1}
h1{font-size:clamp(2.6rem,10vw,4.6rem)}h2{font-size:clamp(2.2rem,8vw,3.4rem)}
p{line-height:1.6;margin:.5em 0}
.ch{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow-y:auto;z-index:2}
.ch.on{display:flex;animation:in .8s ease both}
@keyframes in{from{opacity:0;transform:scale(.96) translateY(14px)}}
.ch>*{max-width:560px;width:100%}
.glass{background:rgba(255,255,255,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:22px;box-shadow:0 12px 40px rgba(107,31,58,.15)}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:13px 26px;color:#fff;background:linear-gradient(135deg,var(--gold),var(--wine));box-shadow:0 6px 22px rgba(183,110,121,.55);transition:transform .2s}
button:active{transform:scale(.95)}button.alt{background:#fff;color:var(--wine)}
button.glow{animation:glow 2s infinite}
@keyframes glow{50%{box-shadow:0 0 34px 8px rgba(255,150,180,.8)}}
button:focus-visible{outline:3px solid var(--wine);outline-offset:3px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.fh{position:fixed;bottom:-30px;z-index:1;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
#mute{position:fixed;top:12px;right:12px;z-index:60;padding:10px 14px}
#bar{position:fixed;left:0;top:0;height:4px;background:var(--gold);z-index:60;transition:width .5s}
/* envelope */
.env{position:relative;width:240px;height:160px;margin:26px auto;background:var(--blush);border-radius:6px;box-shadow:0 14px 40px rgba(107,31,58,.3)}
.env .fl{position:absolute;top:0;left:0;width:0;height:0;border:120px solid transparent;border-top:90px solid #e8a9bd;transform-origin:top;transition:transform .9s;z-index:3}
.env .ct{position:absolute;left:14px;right:14px;top:10px;bottom:10px;background:#fff;border-radius:4px;transition:transform .9s .5s;display:grid;place-items:center;font-size:2rem}
.env.open .fl{transform:rotateX(180deg);z-index:0}.env.open .ct{transform:translateY(-70px)}
.env:before{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(160deg,#f3b9ca,#e8a9bd);z-index:1;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
/* cake */
.cake{position:relative;width:200px;height:170px;margin:30px auto 10px}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 8px 8px}
.t1{bottom:0;width:200px;height:70px;background:linear-gradient(#f7b6c8,#e58aa6)}
.t2{bottom:70px;width:140px;height:55px;background:linear-gradient(#fff,#f3dfe8)}
.can{position:absolute;bottom:125px;width:10px;height:34px;background:var(--lilac);border-radius:3px;cursor:pointer}
.can:after{content:"";position:absolute;top:-19px;left:-1px;width:12px;height:18px;background:radial-gradient(#fff 10%,#ffb347 50%,transparent 70%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:fl .3s infinite alternate;transform-origin:bottom}
.can.out:after{display:none}
@keyframes fl{to{transform:scale(1.15,.9) rotate(4deg)}}
/* polaroids */
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:560px}
.pol{background:#fff;padding:8px 8px 6px;border-radius:4px;box-shadow:0 8px 22px rgba(0,0,0,.2);transform:rotate(var(--r));transition:transform .3s;cursor:pointer;font-size:.8rem}
.pol:hover{transform:rotate(0) scale(1.05)}.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pol span{display:block;padding:6px 0 2px;font-family:"Great Vibes",cursive;font-size:1.3rem}
#lb{position:fixed;inset:0;background:rgba(40,0,20,.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:70;gap:12px;color:#fff;padding:20px}
#lb.on{display:flex}#lb img{max-width:92vw;max-height:65vh;border:10px solid #fff;border-radius:4px}
/* quiz */
.pg{height:8px;background:rgba(255,255,255,.6);border-radius:9px;overflow:hidden;margin:6px 0 16px}.pg i{display:block;height:100%;background:var(--gold);transition:width .4s}
.yn{position:relative;height:150px}.yn button{position:absolute;top:20px}
#yes{left:calc(50% - 130px)}#no{left:calc(50% + 10px);transition:left .25s,top .25s}
.react{min-height:3.2em;font-style:italic}
/* puzzle */
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px;font-size:.85rem}.tabs b{padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.5);font-weight:500}.tabs b.on{background:var(--wine);color:#fff}
.hp{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:min(78vw,300px);margin:14px auto}
.hp div{aspect-ratio:1;background-size:300% 300%;border-radius:6px;cursor:pointer;box-shadow:0 0 0 1px rgba(107,31,58,.25);touch-action:manipulation}
.hp div.sel{outline:4px solid var(--gold);transform:scale(.94)}
.opt{display:block;width:100%;margin:8px 0;background:#fff;color:var(--wine);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.opt.good{background:#b9e8c8}.opt.bad{background:#f6b8b8}
.scene{position:relative;height:250px;border-radius:20px;background:radial-gradient(circle at 30% 20%,#fff6,transparent 50%),rgba(255,255,255,.35);overflow:hidden}
.hh{position:absolute;font-size:1.7rem;opacity:.28;cursor:pointer;background:none;box-shadow:none;padding:4px;transition:all .4s}
.hh.f{opacity:1;transform:scale(1.5);filter:drop-shadow(0 0 8px #f48)}
/* letter */
.paper{background:#fffdf8;border-radius:6px;padding:24px;min-height:250px;text-align:left;font-family:"Great Vibes",cursive;font-size:clamp(1.45rem,5.2vw,1.9rem);line-height:1.5;white-space:pre-wrap;box-shadow:0 14px 40px rgba(107,31,58,.25)}
.pet{position:fixed;top:-20px;z-index:1;pointer-events:none;animation:pet linear forwards}
@keyframes pet{to{transform:translate(60px,110vh) rotate(540deg)}}
/* room */
.room{background:radial-gradient(circle at 50% 30%,#4a1a55,#1a0820);color:#fff}
#stars{position:fixed;inset:0;z-index:0}
.big{font-size:5rem;animation:beat 1.2s infinite}@keyframes beat{30%{transform:scale(1.25)}}
.gift{font-size:5rem;cursor:pointer;background:none;box-shadow:none;padding:0;animation:beat 2s infinite}
.fp{position:fixed;width:70px;height:70px;object-fit:cover;border:4px solid #fff;border-radius:3px;z-index:1;opacity:.7;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateY(-25px) rotate(6deg)}}
.glowt{text-shadow:0 0 14px #fff,0 0 34px #ff7aa8;color:#fff}
.bal{position:fixed;bottom:-120px;font-size:3.4rem;z-index:1;animation:up 12s linear infinite}
.col{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.col img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

p{letter-spacing:.02em;color:#e8d5cb}

button{font-family:Jost,sans-serif;font-weight:500;font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;color:#2a0f1c;background:linear-gradient(135deg,#f0d6a8,#c99a68);box-shadow:0 8px 30px rgba(201,154,104,.28);padding:14px 30px;translate:var(--mx,0) var(--my,0);transition:transform .2s,translate .25s}

.opt{text-transform:none;letter-spacing:.04em;font-size:.95rem;font-weight:300}.opt.good{background:rgba(120,200,150,.3)}.opt.bad{background:rgba(220,100,110,.3)}

.paper{color:#4a1a2a}.pol{color:#4a1a2a}.react{color:#e8d5cb}

.eb{display:block;font:400 .7rem Jost;letter-spacing:.42em;text-transform:uppercase;color:#d9b98a;margin-bottom:6px}
.hcv{position:fixed;left:0;top:0;z-index:-1;max-width:none!important}
.ring{position:relative;width:96px;height:96px;margin:12px auto 6px;cursor:pointer;user-select:none}

.lenv{margin-top:96px}

.scene{height:290px}
